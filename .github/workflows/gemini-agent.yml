name: Gemini Coding Agent

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  coding-agent:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@gemini-cli') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create agent branch
        run: |
          BRANCH="agent/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          echo "AGENT_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run Gemini coding agent
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"

        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite

          prompt: |
            Implement GitHub Issue #${{ github.event.issue.number }}.

            TITLE:
            ${{ github.event.issue.title }}

            REQUIREMENTS:
            ${{ github.event.issue.body }}

            Read GEMINI.md first.

            Inspect only files relevant to this issue.

            Do not read the entire repository.
            Do not repeatedly read the same files.
            Do not inspect unrelated modules.
            Do not perform unrelated refactors.

            Follow existing NestJS, TypeORM and migration patterns.

            Never enable synchronize:true.
            Never commit secrets.
            Never store Provider credentials in plaintext.

            Implement the smallest complete solution for this issue.

            Run these once after implementation:

            npm run typecheck
            npm test -- --runInBand
            npm run build

            Fix only failures caused by this issue.

          settings: |
            {
              "model": {
                "maxSessionTurns": 24,
                "compressionThreshold": 0.2,
                "summarizeToolOutput": {
                  "run_shell_command": {
                    "tokenBudget": 1500
                  }
                }
              },
              "context": {
                "discoveryMaxDirs": 60,
                "fileFiltering": {
                  "respectGitIgnore": true,
                  "respectGeminiIgnore": true
                }
              }
            }

      - name: Verify implementation
        run: |
          npm run typecheck
          npm test -- --runInBand
          npm run build

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "gemini-coding-agent"
          git config user.email "gemini-coding-agent@users.noreply.github.com"
          git add -A
          git commit -m "Implement issue #${{ github.event.issue.number }}"
          git push origin "$AGENT_BRANCH"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$AGENT_BRANCH" \
            --title "Implement #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" \
            --body "Automated implementation for #${{ github.event.issue.number }} using Gemini CLI.

          Closes #${{ github.event.issue.number }}

          Validation:
          - npm run typecheck
          - npm test -- --runInBand
          - npm run build"

      - name: Comment when no changes were produced
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Gemini produced no repository changes. Please review the Actions log."
